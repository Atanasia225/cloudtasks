<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudTasks</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>CloudTasks</h1>

      <details class="settings">
        <summary>⚙️ Налаштування</summary>
        <div class="pop">
          <p class="label">Колір фону</p>
          <div class="swatches" id="bgs">
            <button type="button" class="swatch" data-bg="#ffffff" style="background:#ffffff" title="Білий" aria-label="Білий"></button>
            <button type="button" class="swatch" data-bg="#e8f1ff" style="background:#e8f1ff" title="Світло-блакитний" aria-label="Світло-блакитний"></button>
            <button type="button" class="swatch" data-bg="#f4f6fb" style="background:#f4f6fb" title="Світло-сірий" aria-label="Світло-сірий"></button>
            <button type="button" class="swatch" data-bg="#efe9ff" style="background:#efe9ff" title="Світло-фіолетовий" aria-label="Світло-фіолетовий"></button>
            <button type="button" class="swatch" data-bg="#0f172a" style="background:#0f172a" title="Темний" aria-label="Темний"></button>
          </div>
          <label class="custom">Власний колір
            <input type="color" id="bgCustom" value="#f5f7fb">
          </label>
        </div>
      </details>
    </header>

    <section class="card clock" aria-label="Годинник">
      <div id="time" class="time">00:00:00</div>
      <div id="date" class="date"></div>
    </section>

    <section id="home" class="card" hidden>
      <p>Простий список завдань із описами, який однаково відкривається на будь-якому пристрої. Без реєстрації: доступ дає лише посилання на сторінку списку.</p>
      <button id="create" type="button">Створити список</button>
      <a id="last" class="last" hidden>Відкрити останній список</a>
    </section>

    <div id="list" hidden>
      <div class="stats">
        <div class="stat"><span id="statTotal">0</span><small>Всього завдань</small></div>
        <div class="stat"><span id="statDone">0</span><small>Виконано</small></div>
      </div>

      <form id="add" class="card">
        <input id="title" maxlength="200" placeholder="Назва завдання" autocomplete="off" required>
        <textarea id="desc" rows="2" maxlength="1000" placeholder="Короткий опис (необов’язково)"></textarea>
        <button type="submit">Додати завдання</button>
      </form>

      <div class="filters" id="filters">
        <button class="chip active" data-filter="all" type="button">Усі</button>
        <button class="chip" data-filter="active" type="button">Активні</button>
        <button class="chip" data-filter="done" type="button">Виконані</button>
      </div>

      <ul id="tasks"></ul>
      <p id="empty" class="empty" hidden></p>
    </div>

    <p id="error" role="alert" hidden></p>
  </main>

  <dialog id="editor">
    <form id="editForm">
      <h2>Редагувати завдання</h2>
      <label>Назва
        <input id="editTitle" maxlength="200" required autocomplete="off">
      </label>
      <label>Нотатка
        <textarea id="editDesc" rows="4" maxlength="1000"></textarea>
      </label>
      <div class="actions">
        <button type="button" id="editCancel" class="secondary">Скасувати</button>
        <button type="submit">Зберегти</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
